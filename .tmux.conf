###############
### options ###
###############

set -g prefix C-d
set -g history-limit 8000
set -g base-index 1
set -g pane-base-index 1
set -g status-interval 2
set -g status-keys vi
set -g mode-keys vi
set -g history-file /tmp/tmux.history

# shell
set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh
set -g display-panes-time 3000
set -g display-time 1000
set -s escape-time 10
set -g xterm-keys off
set -g set-titles on
set -g automatic-rename on
set -g renumber-windows on
set -g exit-unattached off
set -g mouse on
# allow in-pane apps (e.g. pi) to set the system clipboard via OSC 52
# (tmux 3.3+ defaults to `external`, which silently drops app OSC 52)
set -g set-clipboard on
set -s focus-events on
set -sg repeat-time 300

# term
set -g default-terminal "${TERM}"
set-option -ga terminal-overrides "*:Tc"

# for pi
set -g extended-keys on
set -g extended-keys-format csi-u
# forward the kitty keyboard protocol (CSI-u) to clients so apps can
# distinguish ctrl+j/ctrl+k from enter; foot supports this protocol
set -ga terminal-features ',*:kitty'

# activity
set -g monitor-activity on
set -g visual-activity off

# size windows based on clients looking at that window
setw -g aggressive-resize on

# enable Yazi's image preview
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# for hyprland
set -ga update-environment HYPRLAND_INSTANCE_SIGNATURE

################
### bindings ###
################
# C-m = Enter
# C-i = Tab
# C-h = Backspace
# C-[ = Escape
# C-j = NewLine

tmux_scripts="$HOME/.zsh.d/scripts"

# tmux command
bind : command-prompt

# reload configuration
bind -r r source-file "$HOME/.tmux.conf" \; display-message "tmux reloaded"

# pane — create
bind -n C-_ split-window -v -c "#{pane_current_path}"
bind -n C-/ split-window -v -c "#{pane_current_path}"
bind -n C-\\ split-window -h -c "#{pane_current_path}"

# pane — navigate
bind -n C-p if-shell -F '#{window_zoomed_flag}' { last-pane ; resize-pane -Z } { last-pane }
bind -r i select-pane -t '{top-left}'
bind -r o select-pane -t '{top-right}'
bind -r j select-pane -t '{bottom-left}'
bind -r k select-pane -t '{bottom-right}'

# pane — resize
bind -n C-z resize-pane -Z
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# pane — manage
bind -r p command-prompt -p "Rename pane:"   "set-option -p @pane_name '%%'"
bind -r T command-prompt -p "Join pane from:" "join-pane -bh -s '%%'"
bind -r t command-prompt -p "Move pane to:"  "join-pane -dh -t '%%'"
bind -r [ command-prompt -p "Swap pane with:" "swap-pane -d -t '%%'"
bind -r b break-pane
bind -r ] rotate-window
bind -r y setw synchronize-panes
bind -n C-s display-panes
bind -n C-x kill-pane
bind -r C-o kill-pane -a

# window — navigate
bind -r 0 select-window -t 0
bind -r 1 select-window -t 1
bind -r 2 select-window -t 2
bind -r 3 select-window -t 3
bind -r 4 select-window -t 4
bind -r 5 select-window -t 5
bind -r 6 select-window -t 6
bind -r 7 select-window -t 7
bind -r 8 select-window -t 8
bind -r 9 select-window -t 9
bind -n C-u if-shell "[ #{window_start_flag} -eq 1 ]" "" "previous-window"
bind -n C-n if-shell "[ #{window_end_flag} -eq 1 ]" "" "next-window"
bind -r C-p last-window
bind -r h select-window -t '{start}'
bind -r l select-window -t '{end}'
bind -r f command-prompt -p "Find window:"   "find-window '%%'"

# window — manage
bind -r c new-window -c "#{pane_current_path}"
bind -r n command-prompt -p "Rename window:" "rename-window -- '%%'"
bind -r s command-prompt -p "Move window to:" "move-window -t '%%'"
bind -r S command-prompt -p "Swap window with:" "swap-window -d -t '%%'"
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window
bind -r O kill-window -a

# session
bind -r N command-prompt -p "Rename session:" "rename-session -- '%%'"
bind -r C-n switch-client -n
bind -r C-c command-prompt -p "Create session:" "new -A -s '%%'"
bind -r C-t command-prompt -p "Switch session:" "switch-client -t %%"
bind -r C-d detach

# copy mode
bind -r Enter copy-mode
bind -r v paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# misc
bind -r M show-messages
bind -r ? list-keys
bind -r C-b set-option status
bind -r E new-window sh -c '$EDITOR $HOME/.tmux.conf'

# send-keys
bind -r m send-keys -t ! C-c C-l C-k Enter

##############
### themes ###
##############

# One Dark
tmux_bg="#282c34"
tmux_fg="#abb4c1"
tmux_black="#282c34"
tmux_gray="#5c6370"
tmux_red="#e06c75"
tmux_yellow="#e5c07b"
tmux_green="#98c379"
tmux_blue="#4F95E5"
tmux_cyan="#3e4452"
tmux_magenta="#c6aae8"
tmux_font_style="bold"

# format strings
tmux_reset="#[bg=default fg=${tmux_gray} bold]"
tmux_separator="#[bg=default fg=${tmux_black} bold]/"
tmux_time="#[fg=${tmux_blue} bg=default bold]%H:%M"
tmux_host="#[fg=${tmux_blue} bg=default bold]#H"
tmux_session="#[fg=${tmux_blue} bg=default bold][#S]"
tmux_window="#[fg=${tmux_blue} bg=default bold]#W"
tmux_cpu="#($tmux_scripts/cpu.sh bold)"
tmux_memory="#($tmux_scripts/memory.sh bold)"
tmux_disk="#($tmux_scripts/disk.sh bold)"
tmux_temp="#($tmux_scripts/temp.sh bold)"
tmux_uptime="#[fg=${tmux_blue} bg=default bold]#($tmux_scripts/uptime.sh)"
tmux_ip="#[fg=${tmux_blue} bg=default bold]#(cat /tmp/ip_address 2>/dev/null || hostname -I | awk '{print $1}')"
tmux_hosts="#[fg=${tmux_blue} bg=default bold]#(cat /tmp/live_hosts 2>/dev/null|wc -l)"
tmux_index="#I:#W#{?@pane_name,.#{@pane_name},}"

# messages (default message-line 0: message replaces the statusline line while shown)
set -g message-style "bg=default,fg=${tmux_blue},align=left,bold"
set -g message-command-style "bg=default,fg=${tmux_fg},align=left,bold"

# pane border (styles: simple, double, heavy, number)
# active pane border uses accent blue so focus is obvious when two panes look identical
set -g pane-border-lines simple
set -g pane-border-style "fg=${tmux_gray}"
set -g pane-active-border-style "fg=${tmux_gray}"

# dim unfocused panes: terminal bg (#0d1117) is near-black so background
# contrast is impossible (pure black makes the focused pane look bright).
# Dim only default-colour text; colored output (eza ls) keeps its colors.
# NOTE: window-active-style needs an explicit fg, otherwise active pane
# falls back to window-style and everything looks dim.
set -g window-style "fg=#838b99"
set -g window-active-style "fg=${tmux_fg}"

# statusline
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-style "bg=default,fg=${tmux_fg}"

set -g status-left "${tmux_session} "

# zoom / sync status panel (right side, left of CMDT); letters highlight when active
# NB: use shell vars (not set -g @opts) so the #{} formats stay inline and get expanded
tmux_zoom="#{?window_zoomed_flag,#[fg=${tmux_green} bg=default bold]Z,#[fg=${tmux_gray} bg=default bold]Z}"
tmux_sync="#{?pane_synchronized,#[fg=${tmux_green} bg=default bold]S,#[fg=${tmux_gray} bg=default bold]S}"
set -g status-right "${tmux_zoom}${tmux_sync} ${tmux_reset}C${tmux_cpu} ${tmux_reset}M${tmux_memory} ${tmux_reset}D${tmux_disk} ${tmux_reset}T${tmux_temp}"

# window style
set -g window-status-separator ""
set -g window-status-activity-style "bg=default,fg=${tmux_fg},bold"

set -g window-status-style "bg=default,fg=${tmux_fg},bold"
set -g window-status-format "#[fg=${tmux_gray} bg=default bold]${tmux_index} "

set -g window-status-current-style "bg=default,fg=white"
set -g window-status-current-format "#[fg=${tmux_blue} bold]${tmux_index} "

# mode
set -g clock-mode-colour "${tmux_blue}"
set -g mode-style "bg=${tmux_black},fg=white,bold"
