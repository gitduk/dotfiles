# ~/.pi/settings.toml — the connections pi talks to, and the models they serve.

# What a bare `pi` runs when no session resumes one.
model = "ccs/deepseek-v4.1-flash"

status = ["elapsed", "in_out", "speed", "cache", "ctx", "queued", "compacted", "cost"]

# Local gateway on 127.0.0.1:7896. Its catalog names a per-model API shape, but
# every model also answers Chat Completions, so one `chat` connection serves all.
[provider.ccs]
base_url            = "http://127.0.0.1:7896/v1"
format              = "chat"
api_key             = "x"
context_window      = "limit.context"
max_output_tokens   = "limit.output"
vision              = "modalities.input"
accepts_temperature = "capabilities.temperature"
reasoning           = "capabilities.reasoning.supported"

[provider.ccs.pricing]
input_per_mtok      = "cost.text.input.price"
output_per_mtok     = "cost.text.output.price"
cache_read_per_mtok = "cost.text.input.cache.read"

[keys]
"menu.accept"   = ["tab"]
"menu.next"     = ["down", "ctrl+n", "ctrl+j"]
"menu.previous" = ["up", "ctrl+p", "ctrl+k"]

# Library docs on demand: resolve a library, then query its current docs.
[mcp.context7]
url = "https://mcp.context7.com/mcp"

# Banner when a run finishes and this terminal is not the focused window.
[[hooks]]
on      = ["run.done"]
command = "~/.pi/hooks/notify-unfocused.sh 5 'pi: Done'"

# An ssh command from `bash` waits for a yes on the input line.
[[hooks]]
on      = ["tool.before"]
tools   = ["bash"]
command = "~/.pi/hooks/ssh-gate"
