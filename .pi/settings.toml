# ~/.pi/settings.toml — the connections pi talks to, and the models they serve.

# What a bare `pi` runs when no session resumes one.
model = "deepseek-v4.1-flash"

status = ["elapsed", "in_out", "speed", "cache", "ctx", "queued", "compacted", "cost"]

# Local Bifrost gateway in podman (--network=host, :8080, OpenAI-compatible
# Chat Completions). Its VK allows gemini and vllm, every model; ids carry the
# upstream prefix, so a selection is bifrost/gemini/gemini-3-flash-preview.
[provider.bifrost]
base_url            = "http://localhost:8080/v1"
format              = "chat"
api_key             = "$BIFROST_API_KEY"
context_window      = "context_length"
max_output_tokens   = "max_output_tokens"
# Bifrost pins an opencode-go request to one upstream by this id; a fresh one
# per request lands on a different upstream, whose prompt cache is cold.
session_header      = "x-bf-session-id"

[provider.bifrost.pricing]
unit                = "token"
input_per_mtok      = "pricing.prompt"
output_per_mtok     = "pricing.completion"
cache_read_per_mtok = "pricing.input_cache_read"

[keys]
"menu.accept"   = ["tab"]
"menu.next"     = ["down", "ctrl+n", "ctrl+j"]
"menu.previous" = ["up", "ctrl+p", "ctrl+k"]

# Library docs on demand: resolve a library, then query its current docs.
[mcp.context7]
url = "https://mcp.context7.com/mcp"

# Obsidian vault via the Local REST API with MCP plugin. Its CA is in the system
# trust store; the header value in ~/.pi/.env carries the full "Bearer <key>".
[mcp.obsidian]
url     = "https://127.0.0.1:27124/mcp"
headers = { Authorization = "$OBSIDIAN_AUTHORIZATION" }

# DBX desktop app: connection list, schema inspection and SQL over its local
# MCP endpoint; the header value in ~/.pi/.env carries the full "Bearer <key>".
[mcp.dbx]
url     = "http://127.0.0.1:5225/mcp"
headers = { Authorization = "$DBX_AUTHORIZATION" }

# Banner when a run finishes and this terminal is not the focused window.
[[hooks]]
on      = ["run.done"]
command = "~/.pi/hooks/notify-unfocused.sh 5 'pi: Done'"

# An ssh command from `bash` waits for a yes on the input line.
[[hooks]]
on      = ["tool.before"]
tools   = ["bash"]
command = "~/.pi/hooks/ssh-gate"
