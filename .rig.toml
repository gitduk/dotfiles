#######################################
### rig.toml — migrated from lazy.toml
### ARCHITECTURE.md §2 schema
### `completions` 默认开启，省略即扫描解包目录里的 _* 文件
### `eval` 是否缓存由 rig 自动探测，配置里不写
#######################################

# ============ [[repo]] GitHub/Codeberg release 二进制 ============

[[repo]]
name = "dandavison/delta"
bpick = "delta-*-x86_64-unknown-linux-gnu.tar.gz"
bin = "delta"
description = "A viewer for git and diff output"

[[repo]]
name = "sharkdp/fd"
bpick = "fd-v*-x86_64-unknown-linux-gnu.tar.gz"
bin = "fd"
description = "A program to find entries in your filesystem"

[[repo]]
name = "BurntSushi/ripgrep"
bpick = "ripgrep-*-x86_64-unknown-linux-musl.tar.gz"
bin = "rg"
description = "ripgrep recursively searches directories for a regex pattern"

[[repo]]
name = "bootandy/dust"
bpick = "dust-v*-x86_64-unknown-linux-gnu.tar.gz"
bin = "dust"
run = "alias du='dust'"
completions = { generate = "wget -q https://raw.githubusercontent.com/bootandy/dust/refs/heads/master/completions/_dust" }
description = "Like du but more intuitive"

[[repo]]
name = "Canop/dysk"
bpick = "dysk_*.zip"
bin = "dysk"
run = "alias ds='dysk'"
setup = "mv */completion/_dysk .; mv */x86_64-unknown-linux-musl/dysk .; rm -rf */"
description = "dysk displays filesystem information in a pretty table"

[[repo]]
name = "casey/just"
bin = "just"
completions = { generate = "./just --completions zsh > _just" }
description = "Just a command runner"

[[repo]]
name = "neovim/neovim"
bpick = "nvim-linux-x86_64.appimage"
extract = false
bin = { "nvim-*.appimage" = "nvim" }
description = "Hyperextensible Vim-based text editor"

[[repo]]
name = "tstack/lnav"
bin = "lnav"
description = "A log file viewer for the terminal that indexes log messages"

[[repo]]
name = "karol-broda/snitch"
bpick = "snitch_*_linux_amd64.tar.gz"
bin = "snitch"
run = "alias sn='snitch'"
completions = { generate = "./snitch completion zsh > _snitch" }
description = "A tool for inspecting network connections"

[[repo]]
name = "lusingander/serie"
bpick = "serie-*-x86_64-unknown-linux-gnu.tar.gz"
bin = { "serie" = "se" }
description = "A rich git commit graph in your terminal"

[[repo]]
name = "fastfetch-cli/fastfetch"
bpick = "fastfetch-linux-amd64.tar.gz"
bin = { "fastfetch-*/usr/bin/fastfetch" = "fastfetch" }
run = "alias ff='fastfetch'"
description = "A neofetch-like tool for fetching system information"

[[repo]]
name = "astral-sh/uv"
bpick = "uv-x86_64-unknown-linux-gnu.tar.gz"
bin = "uv"
completions = { generate = "./uv generate-shell-completion zsh > _uv" }
description = "An extremely fast Python package manager"

[[repo]]
name = "bahdotsh/feedr"
bpick = "feedr-linux-x86_64"
extract = false
bin = { "feedr*" = "feedr" }
description = "A modern terminal-based RSS/Atom feed reader"

[[repo]]
name = "pranshuparmar/witr"
bpick = "witr-linux-amd64"
extract = false
bin = { "witr*" = "witr" }
run = "alias wi='witr'"
description = "Explains why a process or port is running by tracing its ancestry"

[[repo]]
name = "abhimanyu003/sttr"
bpick = "sttr_Linux_x86_64.tar.gz"
bin = "sttr"
run = "alias sr='sttr'"
completions = { generate = "./sttr completion zsh > _sttr" }
description = "A command line tool to quickly apply various transformation operations"

[[repo]]
name = "ducaale/xh"
bin = "xh"
run = "alias x='xh'"
description = "A friendly and fast tool for sending HTTP requests"

[[repo]]
name = "pamburus/hl"
bpick = "hl-linux-x86_64-musl.tar.gz"
bin = "hl"
description = "JSON and logfmt log converter to human readable representation"

[[repo]]
name = "antonmedv/fx"
bpick = "fx_linux_amd64"
extract = false
bin = { "fx*" = "fx" }
completions = { generate = "./fx_linux_amd64 --comp zsh > _fx" }
description = "Terminal JSON viewer"

[[repo]]
name = "shshemi/tabiew"
bpick = "tw-x86_64-unknown-linux-gnu"
extract = false
bin = { "tw*" = "tw" }
description = "A lightweight TUI to view and query CSV, TSV, and parquet files"

[[repo]]
name = "shadow1ng/fscan"
bpick = "fscan_*_linux_x64"
extract = false
bin = { "fscan_*_linux_x64" = "fscan" }
run = "alias fs='fscan'"
description = "An intranet comprehensive scanning tool"

[[repo]]
name = "achristmascarl/rainfrog"
bpick = "rainfrog-v*-x86_64-unknown-linux-gnu.tar.gz"
bin = { "rainfrog" = "rain" }
description = "A database management tui"

[[repo]]
name = "SagerNet/sing-box"
bpick = "sing-box-*-linux-amd64.tar.gz"
bin = "sing-box"
setup = "sudo setcap cap_net_admin=+ep */sing-box"
description = "The universal proxy platform"

[[repo]]
name = "cli/cli"
bpick = "gh_*_linux_amd64.tar.gz"
bin = { "gh_*/bin/gh" = "gh" }
completions = { generate = "./gh completion -s zsh > _gh" }
description = "Work seamlessly with GitHub from the command line"

[[repo]]
name = "Nukesor/pueue"
bpick = ["pueue-x86_64-unknown-linux-musl", "pueued-x86_64-unknown-linux-musl"]
extract = false
bin = { "pueue*-musl" = "pueue", "pueued*-musl" = "pueued" }
completions = { generate = "./pueue-x86_64-unknown-linux-musl completions zsh > _pueue" }
description = "Interact with the Pueue daemon - a command-line task management tool"

[[repo]]
name = "sxyazi/yazi"
bpick = "yazi-x86_64-unknown-linux-musl.zip"
bin = ["yazi", "ya"]
run = "alias y='yazi'"
description = "Blazing fast terminal file manager written in Rust"

[[repo]]
name = "mountain-loop/yaak"
bpick = "yaak_*_amd64.AppImage"
extract = false
bin = { "yaak*" = "yaak" }
description = "Desktop API client for REST, GraphQL, and gRPC"

[[repo]]
name = "oven-sh/bun"
bpick = "bun-linux-x64.zip"
bin = "bun"
run = '''
alias b="bun"
alias bx="bun x"
alias br="bun run"
alias bad="bun add"
alias bis="bun install"
alias brm="bun remove"
alias brs="bun run serve"
'''
env = { BUN_INSTALL = "~/.local" }
completions = { generate = "wget https://raw.githubusercontent.com/oven-sh/bun/refs/heads/main/completions/bun.zsh -O _bun" }
description = "A fast JavaScript runtime, package manager, bundler, and test runner"

[[repo]]
name = "eza-community/eza"
bpick = "eza_x86_64-unknown-linux-gnu.tar.gz"
bin = "eza"
run = "alias ls='eza'"
description = "A modern replacement for ls"

[[repo]]
name = "sharkdp/bat"
bpick = "bat-v*-x86_64-unknown-linux-gnu.tar.gz"
bin = { "bat-*/bat" = "bat" }
completions = { generate = "./bat --completion zsh > _bat" }
description = "A cat clone with syntax highlighting and Git integration"

[[repo]]
name = "mozilla/sccache"
bpick = "sccache-v*-x86_64-unknown-linux-musl.tar.gz"
bin = "sccache"
description = "Shared compilation cache for C/C++ and Rust"

[[repo]]
name = "Schniz/fnm"
bpick = "fnm-linux.zip"
bin = "fnm"
run = "alias f='fnm'"
eval = "fnm env --use-on-cd --shell zsh"
description = "A fast and simple Node.js manager"

[[repo]]
name = "astral-sh/ruff"
bpick = "ruff-x86_64-unknown-linux-musl.tar.gz"
bin = "ruff"
description = "An extremely fast Python linter and code formatter"

[[repo]]
name = "ind-igo/cx"
bpick = "cx-x86_64-unknown-linux-gnu.tar.gz"
bin = "cx"
description = "Semantic code navigation for AI agents"

[[repo]]
name = "stanlyzoolo/keepkit"
bpick = "keepkit_*_linux_x86_64.tar.gz"
bin = "keepkit"
description = "Lightweight TUI for tracking versions of your favorite tools"

# .deb 资产走 §2.5 的 dpkg 流程 —— extract() 通过 `dpkg-deb -x` 解包，不碰系统包数据库
[[repo]]
name = "t8y2/dbx"
bpick = "DBX_*_amd64.deb"
bin = "dbx"
description = "lightweight cross-platform database client"

# 从 zinit 迁移过来的剩余「Binary Tools」——原先靠 zinit ice 装
[[repo]]
name = "starship/starship"
bpick = "starship-x86_64-unknown-linux-gnu.tar.gz"
bin = "starship"
completions = { generate = "./starship completions zsh > _starship" }
env = { STARSHIP_CONFIG = "~/.starship.toml" }
eval = "starship init zsh"
description = "The minimal, blazing-fast, and infinitely customizable prompt for any shell"

[[repo]]
name = "ajeetdsouza/zoxide"
bin = "zoxide"
eval = "zoxide init zsh --cmd j"
description = "A smarter cd command, inspired by z and autojump"

[[repo]]
name = "denisidoro/navi"
setup = "mkdir -p ~/.config/navi/cheats; ./navi info config-example > ~/.config/navi/config.yaml"
env = { NAVI_PATH = "~/.config/navi/cheats", NAVI_CONFIG = "~/.config/navi/config.yaml" }
eval = "navi widget zsh"
lazy = true
bind = "^E:_navi_widget"
description = "An interactive cheatsheet tool for the command-line"

[[repo]]
name = "junegunn/fzf"
bpick = "fzf-*-linux_amd64.tar.gz"
bin = "fzf"
description = "A command-line fuzzy finder"

[[repo]]
name = "tmux/tmux-builds"
bin = "tmux"
description = "Prebuilt tmux binaries"

[[repo]]
name = "gitduk/rig"
bpick = "rig-x86_64-unknown-linux-gnu"
extract = false
bin = { "rig*" = "rig" }
description = "Tool installer + zsh loader"

[[repo]]
name = "earendil-works/pi"
bpick = "pi-linux-x64.tar.gz"
bin = "pi"
description = "AI agent toolkit: unified LLM API, agent loop, TUI, coding agent CLI"

# ============ [[git]] 源码构建（钩子只构建，rig 来放）============

[[git]]
name = "explosion-mental/wallust"
host = "codeberg"
setup = "cargo +nightly build --release"
bin = { "target/release/wallust" = "wallust" }
description = "A tool to generate color schemes from an image"

[[git]]
name = "alacritty/alacritty"
setup = '''export PATH="$HOME/.cargo/bin:$PATH"; cargo build --release --no-default-features --features=wayland; sudo cp extra/logo/alacritty-term.svg /usr/share/pixmaps/Alacritty.svg; sudo desktop-file-install extra/linux/Alacritty.desktop; sudo update-desktop-database'''
bin = { "target/release/alacritty" = "alacritty" }
description = "A fast, cross-platform, OpenGL terminal emulator"

# ============ [[cargo]] cargo install ============

[[cargo]]
name = "bacon"
run = '''
alias bac="bacon"
alias bai="bacon --init"
'''
env = { BACON_CONFIG = "~/.config/bacon/bacon.toml" }
description = "Background rust code checker"

[[cargo]]
name = "zellij"
description = "A terminal workspace with batteries included"

[[cargo]]
name = "doxx"
description = "Expose the contents of .docx files without leaving your terminal"

# ============ [[node]] bun 优先，npm 回退 ============

[[node]]
name = "@openai/codex"
description = "OpenAI Codex command-line interface"

# ============ [[apt]] 系统包 ============

[[apt]]
name = "git"
description = "fast, scalable, distributed revision control system"

[[apt]]
name = "nala"
run = '''
alias nai="sudo nala install -y"
alias nar="sudo nala remove"
alias nap="sudo nala purge"
alias nau="sudo nala update"
alias naug="sudo nala upgrade"
alias naf="sudo nala fetch"
alias nafx="sudo nala --fix-broken"
alias nas="sudo nala show"
alias nasc="sudo nala search"
alias nah="sudo nala history"
alias nac="sudo nala clean"
'''
description = "a front-end for libapt-pkg"

[[apt]]
name = "foot"
description = "A fast, lightweight and minimalistic Wayland terminal emulator"

[[apt]]
name = "kitty"
description = "A cross-platform, GPU-accelerated terminal emulator"

# ============ [[curl]] 安装脚本 ============

[[curl]]
name = "zb"
url = "https://raw.githubusercontent.com/lucasgelfond/zerobrew/main/install.sh"
env = { ZEROBREW_PREFIX = "~/.local" }
description = "A fast Homebrew-compatible package installer"

[[curl]]
name = "claude"
url = "https://claude.ai/install.sh"
run = '''
alias cld="claude"
alias cldr="claude --resume"
alias cldc="claude --continue"
alias ccc='claude -p "commit my dotfiles changes"'
alias ccm='claude -p "/git-commit"'
'''
description = "Claude Code - AI-powered coding assistant CLI"

[[curl]]
name = "deff"
url = "https://raw.githubusercontent.com/flamestro/deff/main/install.sh"
description = "Shows side-by-side file content for a git diff in an interactive terminal UI"

[[curl]]
name = "rtk"
url = "https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh"
setup = "rtk init -g --agent pi"
description = "Token-optimized CLI proxy for Claude Code"

[[curl]]
name = "easytier"
url = "https://github.com/EasyTier/EasyTier/blob/main/script/install.sh?raw=true"
run = "alias epr='easytier-cli peer'"
description = "A simple, decentralized mesh VPN with WireGuard support."

[[curl]]
name = "direnv/direnv"
url = "https://direnv.net/install.sh"
env = { bin_path = "~/.local/bin" }
eval = "direnv hook zsh"
run = '''
alias di="direnv"
alias dia="direnv allow"
alias did="direnv disallow"
alias eenv="v .env"
'''
description = "unclutter your .profile"

[[curl]]
name = "casey/just"
url = "https://just.systems/install.sh"
run = "alias js='just'"
description = "Just a command runner"

# ============ [[plugin]] Job B —— 纯 clone/source，不构建 ============

[[plugin]]
name = "zsh-users/zsh-completions"
source = "zsh-completions.plugin.zsh"

[[plugin]]
name = "zsh-users/zsh-autosuggestions"
source = "zsh-autosuggestions.zsh"
run = '''
ZSH_AUTOSUGGEST_STRATEGY=(match_prev_cmd history)
ZSH_AUTOSUGGEST_HIGHLIGHT_STYLE="fg=8"
bindkey -M viins "^ " autosuggest-execute
bindkey -M vicmd "^ " autosuggest-execute
_zsh_autosuggest_start
'''

[[plugin]]
name = "zdharma-continuum/fast-syntax-highlighting"
source = "fast-syntax-highlighting.plugin.zsh"

[[plugin]]
name = "zsh-users/zsh-history-substring-search"
source = "zsh-history-substring-search.zsh"
run = '''
export HISTORY_SUBSTRING_SEARCH_HIGHLIGHT_FOUND=""
bindkey "^k" history-substring-search-up
bindkey "^j" history-substring-search-down
'''
