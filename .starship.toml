[custom.just]
command = """
printf "\e[1;34m\e[0m"
"""
when = "test -f .justfile || test -f justfile"
shell = ["sh"]
symbol = ""
style = ""
format = "[$symbol$output]($style) "

[custom.direnv]
when = '[ -n "$DIRENV_FILE" ] || [ -f .envrc ] || [ -f .env ]'
command = '''
s=$(direnv status --json 2>/dev/null | jq -r '.state.foundRC.allowed')
case "$s" in
  0) c=32 ;;
  null) exit 0 ;;
  *) c=90 ;;
esac
printf "\e[${c}m󰡱 \e[0m"
'''
shell = ["sh"]
style = ""
format = '[$output]($style)'

[custom.proxy]
command = ""
when = "test $http_proxy"
shell = ["sh"]
symbol = "󱐡"
style = "bold blue"
format = "[$symbol$output]($style) "

[custom.ai]
command = '''
_ai() { i="󱕅"; [ -n "$2" ] && i="󱝁"; printf "$1${i}\e[0m"; }
s=""
[ -n "$ANTHROPIC_BASE_URL" ] && s="$(_ai "\e[93m" "$ANTHROPIC_API_KEY")"
[ -n "$OPENAI_BASE_URL" ]    && s="${s:+$s }$(_ai "\e[32m" "$OPENAI_API_KEY")"
[ -n "$GEMINI_BASE_URL" ]    && s="${s:+$s }$(_ai "\e[34m" "$GEMINI_API_KEY")"
printf "$s"
'''
when = '[ -n "$ANTHROPIC_BASE_URL$OPENAI_BASE_URL$GEMINI_BASE_URL" ]'
shell = ["sh"]
style = ""
format = "$output "

[custom.git_hash]
command = """
list=$(git worktree list 2>/dev/null)
hash=$(echo "$list" | awk 'NR==1{print substr($2,1,7)}')
n=$(echo "$list" | wc -l)
[ "$n" -gt 1 ] && echo "$hash +$((n-1))wt" || echo "$hash"
"""
when = "ls .git"
shell = ["sh"]
symbol = ""
style = "bold blue dimmed"
format = "[$symbol$output]($style) "

