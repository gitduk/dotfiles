# Get editor completions based on the config schema
"$schema" = "https://starship.rs/config-schema.json"

# Inserts a blank line between shell prompts
add_newline = false

# Milliseconds starship may spend scanning the current directory for project
# files. Default 30 is below what a cold scan of a large tree needs.
scan_timeout = 30

# Use custom format
format = """
$hostname\
$directory\
$fossil_branch\
$fossil_metrics\
$git_branch\
${custom.git_hash}\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$package\
$python\
$rust\
$golang\
$nodejs\
$meson\
$cmake\
$jobs\
$cmd_duration\
$fill\
${custom.direnv}\
${custom.ai}\
${custom.just}\
${custom.proxy}\
$time\
$line_break\
$character\
"""

###############
### modules ###
###############

[fill]
symbol = " "
style = "bold blue"

[character]
success_symbol = "[➜](green)"
error_symbol = "[➜](red)"
vimcmd_symbol = "[](green)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
read_only = " ro"
style = "bold blue"

# [directory.substitutions]
# "Documents" = "󰈙 "
# "Downloads" = " "
# "Music" = " "
# "Pictures" = " "

[git_commit]
tag_symbol = " tag "

[git_status]
ahead = ">"
behind = "<"
diverged = "<>"
renamed = "r"
deleted = "x"

[hostname]
ssh_only = true
ssh_symbol = " "

[time]
disabled = false
time_format = "%H:%M"
style = "fg:#5c6370"
format = "[$time]($style)"

[os]
disabled = false
style = "bold white"
format = "[$symbol ]($style)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[aws]
