# cmd-gate rules — one per line, blank lines and full-line/inline # comments ignored.
#
# Format:
#   <trigger prefix> => <suggested replacement> [| <skip-if condition>]
#
# - trigger prefix: matched as a whole-word sequence at the start of a logical
#   command segment (start of string, or right after cd/sudo/time/&&/;/|/().
# - suggested replacement: shown to Claude as the command to use instead;
#   NOT auto-substituted (flag syntax often differs — e.g. curl vs xh — so the
#   caller re-derives the actual command rather than a naive text swap).
# - skip condition (optional): a shell snippet, `eval`'d with CWD as pwd; if it
#   exits 0, this rule is skipped for that call (e.g. respect an existing
#   npm-only project so we don't fight its lockfile).

npm run      => bun run                       | test -f package-lock.json && [ ! -f bun.lockb ] && [ ! -f bun.lock ]
npm install  => bun install                   | test -f package-lock.json && [ ! -f bun.lockb ] && [ ! -f bun.lock ]
npm ci       => bun install --frozen-lockfile | test -f package-lock.json && [ ! -f bun.lockb ] && [ ! -f bun.lock ]
npm test     => bun test                      | test -f package-lock.json && [ ! -f bun.lockb ] && [ ! -f bun.lock ]
npm start    => bun run start                 | test -f package-lock.json && [ ! -f bun.lockb ] && [ ! -f bun.lock ]
npx          => bunx                          | test -f package-lock.json && [ ! -f bun.lockb ] && [ ! -f bun.lock ]
find         => fd
curl         => xh
