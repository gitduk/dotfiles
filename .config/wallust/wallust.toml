# wallust 3.0 beta.*

backend = "fastresize"
color_space = "lch"

# NOTE: v4 palettes are salience (default), ansi or kmeans.
# style = "dark" | "light", use16cols dims the lower half of the palette.
palette = "salience"
style = "dark"
use16cols = true

# Difference between similar colors, used by the colorspace:
#  1          Not perceptible by human eyes.
#  1 - 2      Perceptible through close observation.
#  2 - 10     Perceptible at a glance.
#  11 - 49    Colors are more similar than opposite
#  100        Colors are exact opposite
threshold = 10

[templates]
hypr.template = 'hyprland.lua'
hypr.target = '~/.config/hypr/configs/colors.lua'

waybar.template = 'waybar.css'
waybar.target = '~/.config/waybar/colors.css.tmp'

tofi.template = 'tofi'
tofi.target = '~/.config/tofi/config'

rofi.template = 'rofi.rasi'
rofi.target = '~/.config/rofi/colors.rasi'

kitty.template = 'kitty.conf'
kitty.target = '~/.config/kitty/kitty.conf'

mako.template = 'mako'
mako.target = '~/.config/mako/config'

