[general]
live_config_reload = true
import = ["~/.config/alacritty/colors.toml"]

[env]
QT_IM_MODULE = "fcitx"

[font]
builtin_box_drawing = true
size = 10.0

[font.normal]
family = "Maple Mono NF CN"
style = "Regular"

[font.italic]
family = "Maple Mono NF CN"
style = "Italic"

[font.bold]
family = "Maple Mono NF CN"
style = "Bold"

[font.bold_italic]
family = "Maple Mono NF CN"
style = "Bold Italic"

[font.glyph_offset]
x = 0
y = 0

[font.offset]
x = 0
y = 0

[hints]
alphabet = "jfkdlsahgurieowpq"

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
binding = { key = "Y", mods = "Control" }
# Differences from the upstream default regex:
# - the raw (invisible) U+009F control character is now written as an escape
# - excluded CJK/full-width punctuation: U+2014 em dash, U+2018-201D curly quotes,
#   U+2026 ellipsis, U+3000-303F (、。《》【】…), U+FF01-FF65 fullwidth forms
#   (！（），：；？), so URLs inside Chinese text stop at the punctuation.
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`\u2014\u2018-\u201D\u2026\u3000-\u303F\uFF01-\uFF65]+"

[keyboard]
bindings = [
  { key = "Equals", mods = "Control", action = "None" },
  { key = "Plus", mods = "Control", action = "None" },
  { key = "Minus", mods = "Control", action = "None" },
  { key = "NumpadAdd", mods = "Control", action = "None" },
  { key = "NumpadSubtract", mods = "Control", action = "None" },
]

[mouse]
hide_when_typing = true

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[terminal.shell]
args = ["--login"]
program = "/usr/bin/zsh"

[window]
opacity = 1.0

[window.dimensions]
columns = 0
lines = 0

[window.padding]
x = 10
y = 8

[window.position]
x = 0
y = 0
